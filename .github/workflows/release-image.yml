name: Runner image

# The tag is the release. Build the agent-runner image, prove it
# against a real Postgres (fail after first checkpoint -> retry must
# resume), then push to GHCR. test.yml covers test+lint on branch pushes;
# tags don't trigger it, so a fast unit gate runs here before the push.
# The pushed image is scanned before it ships — a CRITICAL or HIGH
# with a fix available blocks the release; unfixed findings and lower
# severities are report-only. Waivers live in .trivyignore, one line per
# accepted finding with a date and a reason, reviewed per release.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: matterwaveai/agent-runner

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"

    - name: Run unit tests
      run: pytest tests/unit/ --tb=short -q

  smoke:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runner_smoke
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Build runner image
      run: docker build -f docker/Dockerfile -t agent-runner:smoke .

    - name: First attempt — checkpoint, then fail
      # SMOKE_FAIL_STEP=verify makes the second step raise AFTER echo has
      # checkpointed: the run must exit non-zero but leave its checkpoint
      # in Postgres.
      run: |
        if docker run --rm --network host \
          -e IA_RUN_ID=smoke-resume \
          -e IA_MODULES_DB_URL=postgresql://postgres:postgres@localhost:5432/runner_smoke \
          -e SMOKE_FAIL_STEP=verify \
          -e SMOKE_MARKER=run-a \
          -v "$PWD/smoke-out:/out" \
          agent-runner:smoke \
          --pipeline /opt/smoke/smoke_pipeline.yaml \
          --working-dir /opt/smoke
        then
          echo "First attempt should have failed (SMOKE_FAIL_STEP=verify)"
          exit 1
        fi
        echo "First attempt failed as designed"

    - name: Retry with the same run id — must resume
      run: |
        docker run --rm --network host \
          -e IA_RUN_ID=smoke-resume \
          -e IA_MODULES_DB_URL=postgresql://postgres:postgres@localhost:5432/runner_smoke \
          -e SMOKE_MARKER=run-b \
          -v "$PWD/smoke-out:/out" \
          agent-runner:smoke \
          --pipeline /opt/smoke/smoke_pipeline.yaml \
          --working-dir /opt/smoke \
          --output /out/attempt2.json

    - name: Verify it resumed, not reran
      # The output must carry run-a (stamped by the FIRST attempt and
      # restored from the checkpoint) — run-b would mean echo reran.
      run: |
        marker=$(jq -r '.output.echo_marker' smoke-out/attempt2.json)
        echo "echo_marker in resumed output: $marker"
        if [ "$marker" != "run-a" ]; then
          echo "FAIL: expected the checkpointed marker 'run-a', got '$marker' — the retry reran instead of resuming"
          exit 1
        fi
        count=$(docker run --rm --network host postgres:15 \
          psql postgresql://postgres:postgres@localhost:5432/runner_smoke \
          -tAc "SELECT COUNT(*) FROM pipeline_checkpoints WHERE thread_id = 'smoke-resume'")
        echo "Checkpoints for the run: $count"
        if [ "$count" -lt 2 ]; then
          echo "FAIL: expected >= 2 checkpoints (echo from attempt 1, verify from the resumed attempt), got $count"
          exit 1
        fi

  push:
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build locally first — the scan gates the push, not the other way
    # around. The gha cache makes the second build below a near no-op.
    - name: Build for scanning
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: false
        load: true
        tags: agent-runner:release-scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The image scan already reads the installed Python packages
    # off the filesystem, so no separate pip audit runs here. CRITICAL/HIGH
    # with a fix available fail; unfixed and lower severities are
    # report-only noise.
    - name: Scan the image before pushing
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: image
        image-ref: agent-runner:release-scan
        scanners: vuln
        format: table
        ignore-unfixed: true
        severity: CRITICAL,HIGH
        exit-code: "1"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
